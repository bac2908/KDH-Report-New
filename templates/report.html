{% extends "base.html" %}

{% block content %}
<section class="page-header">
  <div>
    <p class="eyebrow">Channel report</p>
    <h2>{{ title }}</h2>
  </div>
  <button class="primary-btn">Refresh data</button>
</section>

<section class="panel summary-panel">
  <div id="report-summary"></div>
</section>

<section class="chart-grid">
  <div class="panel chart-panel">
    <h3>Performance trend</h3>
    <div id="report-chart" class="chart"></div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
  window.dashboardConfig = { reportType: '{{ report_name }}' };
</script>
<script src="{{ url_for('static', path='js/charts.js') }}"></script>
{% endblock %}
