{% macro n(value) %}{{ '{:,.0f}'.format(value).replace(',', '.') }}{% endmacro %}
{% macro pct(value, digits=1) %}{{ ('%.*f'|format(digits, value)).replace('.', ',') }}%{% endmacro %}
{% macro heading(title, icon, subtitle) %}<div class="fc-heading"><h2>{{ title }}</h2><span class="material-symbols-outlined" aria-hidden="true">{{ icon }}</span></div><p class="fc-subtitle">{{ subtitle }}</p>{% endmacro %}
