<dialog id="fc-filter-dialog" class="dashboard-dialog" aria-labelledby="fc-filter-title"><form id="fc-filter-form"><h2 id="fc-filter-title">Bộ lọc bài viết</h2><p>Lọc trong 5 bài viết mẫu. Các chỉ số tổng quan vẫn phản ánh toàn kỳ đang chọn.</p><label>Tìm tiêu đề hoặc chủ đề<input id="fc-query" type="search" maxlength="200" placeholder="Ví dụ: dinh dưỡng"></label><label>Định dạng<select id="fc-format"><option value="all">Tất cả</option><option value="reels">Reels</option><option value="long_video">Video dài</option><option value="carousel">Carousel</option><option value="photo">Photo / Album</option><option value="livestream">Livestream</option></select></label><label>Chủ đề<select id="fc-topic"><option value="all">Tất cả</option>{% for row in fb_content.topics %}<option value="{{ row.key }}">{{ row.label }}</option>{% endfor %}</select></label><p class="form-error" id="fc-filter-error" role="alert" hidden></p><div class="dialog-actions"><button id="fc-reset" type="button">Đặt lại</button><button type="button" data-close-dialog>Hủy</button><button type="submit" class="confirm-button">Áp dụng</button></div></form></dialog>
<dialog id="fc-detail-dialog" class="dashboard-dialog fc-wide-dialog" aria-labelledby="fc-detail-title"><h2 id="fc-detail-title"></h2><div id="fc-detail-content"></div><div class="dialog-actions"><button type="button" class="confirm-button" data-close-dialog>Đóng</button></div></dialog>
